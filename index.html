<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE Design Portal</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#0D1117;color:#fff;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.055);opacity:1}}
@keyframes bar{0%{width:0%;opacity:1}65%{width:72%}100%{width:100%;opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%,54%{transform:translateX(-7px)}36%,72%{transform:translateX(7px)}}
.login-card{background:#1A2035; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; animation: fadein 0.6s ease-out;}
.input-field{width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #2D3748; background: #0D1117; color: #fff; outline: none; font-size: 14px;}
.btn-primary{background: #3B82F6; color: #fff; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s;}
.btn-primary:hover{background: #2563EB;}
.version-card{transition: all 0.2s ease; cursor: pointer;}
.version-card:hover{transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.08) !important;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const { useState, useEffect } = React;

// ----- SVGs -----
const IcFolder = () => e("svg",{width:24,height:24,fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},e("path",{d:"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"}));
const IcLogOut = () => e("svg",{width:18,height:18,fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},e("path",{d:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"}),e("polyline",{points:"16 17 21 12 16 7"}),e("line",{x1:21,y1:12,x2:9,y2:12}));
const IcPlus = () => e("svg",{width:16,height:16,fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},e("line",{x1:12,y1:5,x2:12,y2:19}),e("line",{x1:5,y1:12,x2:19,y2:12}));

// ----- New Image Logo Component -----
const Logo = ({ height = "60px", marginBottom = "0px" }) => 
  e("img", {
    src: "./edge--logo.png",
    alt: "EDGE Design Portal",
    style: {
      height: height,
      width: "auto",
      objectFit: "contain",
      background: "transparent",
      display: "block",
      margin: `0 auto ${marginBottom}`,
      filter: "drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"
    }
  });

// ----- Creative Version Layouts -----
const LayoutHero = () => e("div", { style: { display: "flex", flexDirection: "column", height: "120px", padding: "8px", gap: "8px", background: "#f8f9fa", borderRadius: "6px", width: "100%", border: "1px solid #e2e8f0" } }, e("div", { style: { height: "12px", width: "100%", background: "#e2e8f0", borderRadius: "3px" } }), e("div", { style: { height: "45px", width: "100%", background: "#cbd5e1", borderRadius: "3px" } }), e("div", { style: { display: "flex", gap: "6px", flex: 1 } }, e("div", { style: { flex: 1, background: "#e2e8f0", borderRadius: "3px" } }), e("div", { style: { flex: 1, background: "#e2e8f0", borderRadius: "3px" } }), e("div", { style: { flex: 1, background: "#e2e8f0", borderRadius: "3px" } })));

const LayoutDashboard = () => e("div", { style: { display: "flex", height: "120px", padding: "6px", gap: "6px", background: "#f1f5f9", borderRadius: "6px", width: "100%", border: "1px solid #e2e8f0" } }, e("div", { style: { width: "25%", height: "100%", background: "#64748b", borderRadius: "4px" } }), e("div", { style: { display: "flex", flexDirection: "column", flex: 1, gap: "6px" } }, e("div", { style: { height: "12px", width: "100%", background: "#cbd5e1", borderRadius: "3px" } }), e("div", { style: { display: "flex", flex: 1, gap: "6px" } }, e("div", { style: { flex: 1, background: "#e2e8f0", borderRadius: "3px" } }), e("div", { style: { flex: 1, background: "#e2e8f0", borderRadius: "3px" } })), e("div", { style: { height: "20px", width: "100%", background: "#e2e8f0", borderRadius: "3px" } })));

const LayoutPortfolio = () => e("div", { style: { display: "flex", height: "120px", padding: "8px", gap: "8px", background: "#fafaf9", borderRadius: "6px", width: "100%", border: "1px solid #e2e8f0" } }, e("div", { style: { flex: 5, height: "100%", background: "#d6d3d1", borderRadius: "3px" } }), e("div", { style: { display: "flex", flexDirection: "column", flex: 3, gap: "6px" } }, e("div", { style: { flex: 2, background: "#e7e5e4", borderRadius: "3px" } }), e("div", { style: { flex: 3, background: "#e7e5e4", borderRadius: "3px" } })));

const renderVersionLayout = (index) => {
  if (index % 3 === 0) return e(LayoutHero);
  if (index % 3 === 1) return e(LayoutDashboard);
  return e(LayoutPortfolio);
};

// ----- Main Portal Dashboard -----
function Portal({ handleLogout }) {
  const [clients, setClients] = useState([
    {id: 1, name: "Acme Corp", versions: 3}, 
    {id: 2, name: "Global Tech", versions: 2},
    {id: 3, name: "Stark Ind.", versions: 4}
  ]);
  const [activeClient, setActiveClient] = useState(null);

  return e("div", { style: { display: "flex", height: "100vh", background: "#f4f4f5", color: "#18181b" } },
    
    // Sidebar Area
    e("div", { style: { width: "260px", background: "#18181b", color: "#fff", display: "flex", flexDirection: "column" } },
      e("div", { style: { padding: "24px", borderBottom: "1px solid #27272a", display: "flex", alignItems: "center", justifyContent: "space-between" } },
        e(Logo, { height: "28px" }), // Header Logo
        e("button", { onClick: handleLogout, style: { background: "none", border: "none", color: "#a1a1aa", cursor: "pointer", transition: "color 0.2s" } }, e(IcLogOut))
      ),
      e("div", { style: { padding: "20px", flex: 1, overflowY: "auto" } },
        e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px", color: "#a1a1aa", fontSize: "12px", textTransform: "uppercase", letterSpacing: "1px", fontWeight: "600" } },
          e("span", null, "Clients"),
          e("button", { style: { background: "none", border: "none", color: "#a1a1aa", cursor: "pointer" } }, e(IcPlus))
        ),
        clients.map(c => e("div", {
          key: c.id,
          onClick: () => setActiveClient(c),
          style: { padding: "12px", background: activeClient?.id === c.id ? "#27272a" : "transparent", borderRadius: "8px", cursor: "pointer", marginBottom: "6px", fontSize: "14px", display: "flex", alignItems: "center", gap: "12px", transition: "background 0.2s" }
        }, e(IcFolder), c.name))
      )
    ),

    // Main Content Area
    activeClient ? e("div", { style: { flex: 1, padding: "48px", overflowY: "auto" } },
      e("h1", { style: { fontSize: "28px", fontWeight: "600", marginBottom: "8px", letterSpacing: "-0.5px" } }, `${activeClient.name} Workspace`),
      e("p", { style: { color: "#71717a", marginBottom: "36px", fontSize: "15px" } }, "Review the latest design iterations below."),
      
      e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "24px" } },
        Array.from({ length: activeClient.versions }).map((_, i) => e("div", {
          key: i,
          className: "version-card",
          style: { padding: "16px", background: "#fff", borderRadius: "12px", boxShadow: "0 2px 8px rgba(0,0,0,0.03)", border: "1px solid #e4e4e7" }
        },
          renderVersionLayout(i),
          e("div", { style: { marginTop: "20px", display: "flex", justifyContent: "space-between", alignItems: "center" } },
            e("p", { style: { fontWeight: "600", fontSize: "15px", color: "#27272a" } }, `Version ${i + 1}.0`),
            e("span", { style: { fontSize: "12px", fontWeight: "500", color: "#71717a", background: "#f4f4f5", padding: "6px 10px", borderRadius: "20px" } }, "Pending Review")
          )
        ))
      )
    ) : e("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}},
      e("div",{style:{textAlign:"center",maxWidth:320}},
        e("div",{style:{width:56,height:56,borderRadius:14,background:"rgba(0,0,0,.055)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px",color:"#a1a1aa"}},e(IcFolder)),
        e("h2",{style:{fontSize:17,fontWeight:500,color:"#18181b",marginBottom:7,fontFamily:"Georgia,serif",fontStyle:"italic"}},"Select a client"),
        e("p",{style:{fontSize:13,color:"#a1a1aa",lineHeight:1.7}},clients.length===0?"Create your first client using the + button in the sidebar.":"Choose a client from the sidebar to open their workspace.")
      )
    )
  );
}

// ----- App Controller -----
function App(){
  const[screen,setScreen]=useState("login");
  const[loading,setLoading]=useState(false);
  const[loadingMsg,setLoadingMsg]=useState("");
  
  const transition=(msg,action,dur=1600)=>{
    setLoadingMsg(msg);
    setLoading(true);
    setTimeout(()=>{
      action();
      setTimeout(()=>setLoading(false),300);
    },dur);
  };
  
  const handleLogin=()=>transition("Signing in securely…",()=>setScreen("portal"));
  const handleLogout=()=>transition("Signing out…",()=>setScreen("login"),1400);

  // Transition / Loading Interface
  if (loading) {
    return e("div", { style: { height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0D1117" } },
      e("div", { style: { textAlign: "center", animation: "pulse 1.5s infinite" } },
        e(Logo, { height: "80px", marginBottom: "20px" }), // Invisible background logo
        e("div", { style: { color: "#a1a1aa", fontSize: "14px", marginTop: "16px", letterSpacing: "0.5px" } }, loadingMsg),
        e("div", { style: { width: "120px", height: "3px", background: "#27272a", margin: "16px auto", borderRadius: "3px", overflow: "hidden" } },
          e("div", { style: { height: "100%", background: "#3B82F6", animation: "bar 1.5s ease-out forwards" } })
        )
      )
    );
  }

  // Login Interface
  if (screen === "login") {
    return e("div", { style: { height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0D1117" } },
      e("div", { className: "login-card" },
        e(Logo, { height: "72px", marginBottom: "36px" }), // Invisible background logo
        e("input", { type: "text", placeholder: "Username", className: "input-field" }),
        e("input", { type: "password", placeholder: "Password", className: "input-field" }),
        e("button", { onClick: handleLogin, className: "btn-primary" }, "Access Portal")
      )
    );
  }

  return e(Portal, { handleLogout });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
