function WireframeView({canvas,setCanvas}){
  const dragFrom=useRef(null);
  const [dropIdx,setDropIdx]=useState(null);
  const CATS=[...new Set(PALETTE.map(p=>p.c))];
  const onPD=t=>{dragFrom.current={src:'pal',t};};
  const onCD=idx=>{dragFrom.current={src:'can',idx};};
  const onDO=(e,idx)=>{e.preventDefault();setDropIdx(idx);};
  const onDL=()=>setDropIdx(null);
  const insert=(e,idx)=>{
    e.stopPropagation();
    const df=dragFrom.current;
    if(!df)return;
    if(df.src==='pal'){const pal=PALETTE.find(p=>p.t===df.t);setCanvas(prev=>{const n=[...prev];n.splice(idx,0,{id:uid(),type:df.t,label:pal?.l||df.t});return n;});}
    else if(df.src==='can'&&df.idx!==idx){setCanvas(prev=>{const n=[...prev];const[mv]=n.splice(df.idx,1);n.splice(df.idx<idx?idx-1:idx,0,mv);return n;});}
    dragFrom.current=null;setDropIdx(null);
  };
  const onFallDrop=e=>{
    e.preventDefault();
    const df=dragFrom.current;
    if(df?.src==='pal'){const pal=PALETTE.find(p=>p.t===df.t);setCanvas(prev=>[...prev,{id:uid(),type:df.t,label:pal?.l||df.t}]);}
    dragFrom.current=null;setDropIdx(null);
  };
  const rm=idx=>setCanvas(prev=>prev.filter((_,i)=>i!==idx));

  return React.createElement('div',{style:{display:'flex',height:'100%',minHeight:520}},
    React.createElement('div',{style:{width:152,flexShrink:0,borderRight:`0.5px solid var(--color-border-tertiary)`,overflowY:'auto',padding:'14px 10px',background:'var(--color-background-secondary)'}},
      React.createElement('p',{style:{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--color-text-tertiary)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:14}},'Components'),
      CATS.map(cat=>React.createElement('div',{key:cat,style:{marginBottom:14}},
        React.createElement('p',{style:{fontFamily:'var(--font-mono)',fontSize:8.5,color:'var(--color-text-warning)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:5}},cat),
        PALETTE.filter(p=>p.c===cat).map(p=>React.createElement('div',{key:p.t,className:'pi',draggable:true,onDragStart:()=>onPD(p.t)},p.l))
      ))
    ),
    React.createElement('div',{style:{flex:1,overflowY:'auto',padding:'20px',background:'var(--color-background-primary)'},onDragOver:e=>e.preventDefault(),onDrop:onFallDrop},
      canvas.length===0&&React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:320,gap:10}},
        React.createElement('div',{style:{width:38,height:38,border:`1px dashed ${G(0.18)}`,borderRadius:'var(--border-radius-md)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--color-text-tertiary)',opacity:0.5}},React.createElement(IcPlus,{s:14})),
        React.createElement('p',{style:{fontSize:13,fontWeight:500,color:'var(--color-text-secondary)'}},'Drag components here'),
        React.createElement('p',{style:{fontSize:11,color:'var(--color-text-tertiary)'}},'Build your home page wireframe')
      ),
      React.createElement('div',{style:{maxWidth:580,margin:'0 auto',border:`0.5px solid var(--color-border-tertiary)`,borderRadius:'var(--border-radius-lg)',overflow:'hidden'}},
        React.createElement('div',{style:{background:'var(--color-background-secondary)',padding:'9px 14px',display:'flex',alignItems:'center',gap:7,borderBottom:`0.5px solid var(--color-border-tertiary)`}},
          [['#FF5F57',11],['#FEBC2E',11],['#28C840',11]].map(([c,s],i)=>React.createElement('div',{key:i,style:{width:s,height:s,borderRadius:'50%',background:c}})),
          React.createElement('div',{style:{flex:1,height:20,background:'var(--color-background-primary)',borderRadius:10,marginLeft:8,border:`0.5px solid var(--color-border-tertiary)`,display:'flex',alignItems:'center',paddingLeft:10}},
            React.createElement('span',{style:{fontSize:10,color:'var(--color-text-tertiary)',fontFamily:'var(--font-mono)'}},'yourwebsite.com')
          )
        ),
        React.createElement('div',{className:`dz${dropIdx===0?' hot':''}`,onDragOver:e=>onDO(e,0),onDragLeave:onDL,onDrop:e=>insert(e,0)}),
        canvas.map((item,idx)=>React.createElement('div',{key:item.id,className:'cr',style:{position:'relative',borderBottom:`0.5px solid var(--color-border-tertiary)`}},
          React.createElement('div',{className:'dh',draggable:true,onDragStart:()=>onCD(idx),style:{position:'absolute',left:4,top:'50%',transform:'translateY(-50%)',zIndex:3,color:'var(--color-text-tertiary)',cursor:'grab',padding:3}},React.createElement(IcGrip)),
          React.createElement('div',{style:{position:'absolute',top:5,left:18,zIndex:2,fontSize:8,fontFamily:'var(--font-mono)',color:'var(--color-text-warning)',letterSpacing:'0.06em',textTransform:'uppercase',opacity:0.75,pointerEvents:'none'}},item.label),
          React.createElement('button',{className:'rm',onClick:()=>rm(idx),style:{position:'absolute',top:5,right:6,background:'none',border:'none',cursor:'pointer',color:'var(--color-text-tertiary)',zIndex:3,padding:3,display:'flex',alignItems:'center',justifyContent:'center'}},React.createElement(IcX,{s:7})),
          React.createElement('div',{onDragOver:e=>onDO(e,idx),onDragLeave:onDL,style:{paddingTop:14}},React.createElement(WFB,{type:item.type})),
          React.createElement('div',{className:`dz${dropIdx===idx+1?' hot':''}`,onDragOver:e=>onDO(e,idx+1),onDragLeave:onDL,onDrop:e=>insert(e,idx+1)})
        ))
      )
    )
  );
}

    const title=tab==='sitemap'?'Sitemap':'Wireframe — Home Page';
