html,body,#root{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#0D1117;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.055);opacity:1}}
@keyframes bar{0%{width:0%;opacity:1}65%{width:72%}100%{width:100%;opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.login-card{background:#1A2030;border:0.5px solid rgba(255,255,255,0.07);border-radius:18px;padding:44px 40px;width:400px;animation:fadein .5s ease both;}
.login-input{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:9px;color:#F0F4FF;font-size:14px;padding:13px 44px 13px 15px;outline:none;transition:border-color .15s;font-family:inherit;}
.login-input:focus{border-color:#E87722;}
.login-input::placeholder{color:rgba(255,255,255,0.25);}
.login-input.err{border-color:#E05454;animation:shake .4s ease;}
.login-btn{width:100%;padding:14px;background:#E87722;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;letter-spacing:.02em;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .08s;}
.login-btn:hover{opacity:.9;}
.login-btn:active{transform:scale(.99);}
.sidebar{width:224px;flex-shrink:0;background:#0D1117;border-right:0.5px solid rgba(255,255,255,0.055);display:flex;flex-direction:column;height:100%;overflow:hidden;}
.client-item{padding:10px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .13s,border-color .13s;display:flex;align-items:center;gap:8px;}
.client-item:hover{background:rgba(255,255,255,0.035);border-left-color:rgba(232,119,34,.35);}
.client-item.active{background:rgba(232,119,34,.07);border-left-color:#E87722;}
.pi{padding:6px 10px;font-size:11px;border-radius:6px;border:0.5px solid rgba(0,0,0,.08);background:#fff;color:#52525b;cursor:grab;user-select:none;transition:background .13s,border-color .13s;margin-bottom:3px;display:block;}
.pi:hover{background:#f4f4f5;border-color:rgba(0,0,0,.13);}
.tab-btn{padding:11px 16px;border:none;border-bottom:2px solid transparent;background:none;font-size:13px;cursor:pointer;transition:color .15s,border-color .15s;color:#52525b;font-family:inherit;}
.tab-btn.on{color:#18181b;font-weight:500;border-bottom-color:#E87722;}
.tab-btn:hover:not(.on){color:#18181b;}
.round-btn{border-radius:50%;border:0.5px solid rgba(0,0,0,.13);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;width:34px;height:34px;color:#52525b;}
.round-btn:hover{background:#f4f4f5;}
.dashed-btn{background:none;border:0.5px dashed rgba(0,0,0,.16);border-radius:12px;font-size:10px;color:#a1a1aa;cursor:pointer;font-family:inherit;transition:border-color .1s,color .1s;padding:3px 9px;line-height:1.6;display:inline-flex;align-items:center;gap:3px;}
.dashed-btn:hover{border-style:solid;border-color:rgba(0,0,0,.28);color:#52525b;}
.orange-btn{background:#E87722;color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity .12s,transform .08s;}
.orange-btn:hover{opacity:.88;}
.orange-btn:active{transform:scale(.98);}
.ghost-btn{background:none;border:0.5px solid rgba(0,0,0,.13);color:#52525b;cursor:pointer;font-family:inherit;transition:background .12s,color .12s;}
.ghost-btn:hover{background:#f4f4f5;color:#18181b;}
.form-input{font-family:inherit;font-size:13px;padding:10px 14px;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;color:#18181b;outline:none;width:100%;transition:border-color .14s;}
.form-input:focus{border-color:#E87722;}
.nw .nd{opacity:0;transition:opacity .12s;}
.nw:hover .nd{opacity:1;}
.cr .rm,.cr .dh{opacity:0;transition:opacity .14s;}
.cr:hover .rm,.cr:hover .dh{opacity:1;}
.dz{height:6px;border-top:2px solid transparent;transition:border-top-color .12s;cursor:copy;}
.dz.hot{border-top-color:#E87722;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:2px;}
