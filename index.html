  --color-background-primary: #ffffff;
  --color-background-secondary: #f4f4f5;
  --color-border-primary: #a1a1aa;

  --color-border-tertiary: #f4f4f5;
  --color-text-primary: #18181b;
  --color-text-secondary: #52525b;
  --color-text-tertiary: #a1a1aa;
  --color-text-warning: #8b8b93;
  --border-radius-md: 6px;
  --border-radius-lg: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans); color: var(--color-text-primary);}
.pi{padding:6px 10px;font-size:11px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;user-select:none;transition:background .14s,color .14s,border-color .14s;margin-bottom:3px;display:block;}
.pi:hover{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-secondary);}
.tb{padding:11px 16px;border:none;border-bottom:2px solid transparent;background:none;font-size:13px;font-family:var(--font-sans);cursor:pointer;transition:color .15s,border-color .15s;color:var(--color-text-secondary);}
.tb.on{color:var(--color-text-primary);font-weight:500;border-bottom-color:#EF9F27;}
.tb:hover:not(.on){color:var(--color-text-primary);}
.cb{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:none;cursor:pointer;transition:background .12s,border-color .12s;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--color-text-secondary);}
.cb:hover{background:var(--color-background-secondary);border-color:var(--color-border-primary);color:var(--color-text-primary);}
.ab{background:#EF9F27;color:#3D2000;border:none;cursor:pointer;font-family:var(--font-sans);font-weight:500;transition:opacity .12s,transform .08s;}
.ab:hover{opacity:.88;}
.ab:active{transform:scale(.98);}
.gb{background:none;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);transition:background .12s,color .12s;}
.gb:hover{background:var(--color-background-secondary);color:var(--color-text-primary);}
.an{background:none;border:0.5px dashed var(--color-border-secondary);border-radius:12px;font-size:10px;color:var(--color-text-tertiary);cursor:pointer;font-family:var(--font-sans);transition:border-color .1s,color .1s;padding:3px 9px;line-height:1.6;display:inline-flex;align-items:center;gap:3px;}
.an:hover{border-style:solid;border-color:var(--color-border-primary);color:var(--color-text-secondary);}
.si{font-family:var(--font-sans);font-size:13px;padding:10px 14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);background:var(--color-background-primary);color:var(--color-text-primary);outline:none;width:100%;transition:border-color .14s;}
.si:focus{border-color:#EF9F27;}
.ni{font-family:var(--font-sans);font-size:11px;padding:3px 9px;border:0.5px solid #EF9F27;border-radius:10px;background:var(--color-background-primary);color:var(--color-text-primary);outline:none;transition:border-color .12s;}
.cr .rm,.cr .dh{opacity:0;transition:opacity .14s;}
.cr:hover .rm,.cr:hover .dh{opacity:1;}
.nw .nd{opacity:0;transition:opacity .12s;}
.nw:hover .nd{opacity:1;}
.dz{height:6px;border-top:2px solid transparent;transition:border-top-color .12s;cursor:copy;}
.dz.hot{border-top-color:#EF9F27;}

      canvas.length===0&&React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:320,gap:10}},
        React.createElement('div',{style:{width:38,height:38,border:`1px dashed ${G(0.18)}`,borderRadius:'var(--border-radius-md)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--color-text-tertiary)',opacity:0.5}},React.createElement(IcPlus,{s:14})),

  /* ── Main tool ── */
  return React.createElement('div',{style:{display:'flex',flexDirection:'column',minHeight:560, height:'100vh'}},
    React.createElement('div',{style:{display:'flex',alignItems:'center',borderBottom:`1px solid var(--color-border-secondary)`,background:'var(--color-background-primary)',padding:'0 16px',gap:2,flexShrink:0}},
      proj&&React.createElement('span',{style:{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:15,color:'var(--color-text-primary)',marginRight:10,paddingRight:10,borderRight:`1px solid var(--color-border-secondary)`,whiteSpace:'nowrap'}},proj),
      React.createElement('button',{className:`tb${tab==='sitemap'?' on':''}`,onClick:()=>setTab('sitemap')},'Sitemap'),
      React.createElement('button',{className:`tb${tab==='wireframe'?' on':''}`,onClick:()=>setTab('wireframe')},'Wireframe'),
      React.createElement('div',{style:{flex:1}}),
      React.createElement('button',{className:'gb',onClick:()=>{if(confirm('Are you sure you want to start over?')) {setSitemap(null);setStep(1);}},style:{fontSize:12,padding:'6px 12px',borderRadius:'var(--border-radius-md)',marginRight:8}},'New'),
      React.createElement('button',{className:'ab',onClick:exportPDF,style:{fontSize:12,padding:'7px 16px',borderRadius:'var(--border-radius-md)'}},'\u2193 Export PDF')
    ),
    tab==='sitemap'&&React.createElement('div',{ref:smRef,style:{flex:1,overflowY:'auto', background:'var(--color-background-primary)'}},React.createElement(SitemapView,{sitemap,setSitemap})),
    tab==='wireframe'&&React.createElement('div',{ref:wfRef,style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}},React.createElement(WireframeView,{canvas,setCanvas}))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
