.ab { background: #EF9F27; color: #ffffff; border: none; cursor: pointer; font-family: var(--font-sans); font-weight: 600; transition: all .2s; box-shadow: 0 4px 12px rgba(239, 159, 39, 0.3); }
.ab:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(239, 159, 39, 0.4); }
.ab:active { transform: scale(.98); }

.si { font-family: var(--font-sans); font-size: 15px; padding: 14px 18px; border: 1.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; width: 100%; transition: border-color .2s, box-shadow .2s; }
